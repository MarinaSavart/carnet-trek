services:
  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Vite relaie /api et /uploads vers le backend (réseau interne Docker)
      - API_PROXY_TARGET=http://backend:3000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://mongo:27017/carnet-trek
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      # Mongo n'a pas de mot de passe : accessible depuis cette machine uniquement,
      # pas depuis le reste du réseau (le backend Docker passe par le réseau interne)
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
